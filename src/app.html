<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A local-first personal performance dashboard." />

    <link rel="preload" href="%sveltekit.assets%/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />

    <!-- Resolve the theme before first paint; never flash the wrong paper. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('north:theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.dataset.theme = 'dark';
        } catch (_) {}
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
